---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - external-secrets.io
  resources:
  - pushsecrets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - gsm-tag-controller.io
  resources:
  - gsmsecrettags
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - gsm-tag-controller.io
  resources:
  - gsmsecrettags/finalizers
  verbs:
  - update
- apiGroups:
  - gsm-tag-controller.io
  resources:
  - gsmsecrettags/status
  verbs:
  - get
  - patch
  - update
